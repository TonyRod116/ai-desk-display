[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desk-display"
version = "0.1.0"
description = "Animated AI usage displays for your desk: eight scenes, local rendering, ESP32 touch support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.2,<13"]

[project.urls]
Homepage = "https://github.com/TonyRod116/ai-desk-display"

[project.scripts]
ai-desk-display = "token_tv.cli:main"
token-tv = "token_tv.cli:main"

[tool.setuptools]
packages = ["token_tv", "token_tv.providers"]

[tool.setuptools.package-data]
token_tv = ["web/*", "assets/*.png", "assets/*.json"]
