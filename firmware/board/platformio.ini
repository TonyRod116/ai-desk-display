; TokenTV board firmware for ESP32 touch displays (Cheap Yellow Display, ESP32-2432S028R).
;
; The board only shows JPEG pages the PC pushes and changes page when touched.
; Two environments because that board shipped with two display chips:
;   cyd         ILI9341 (most units, including those sold as NerdMiner touch boards)
;   cyd_st7789  ST7789  (newer revision; use it if "cyd" gives a white or garbled screen)
[platformio]
default_envs = cyd

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv   ; two 1 MB app slots for wifi updates + ~1.9 MB for eight raw pages; NVS offset unchanged
lib_deps =
    bodmer/TFT_eSPI
    paulstoffregen/XPT2046_Touchscreen
    tzapu/WiFiManager
build_flags =
    -D USER_SETUP_LOADED=1
    -D CORE_DEBUG_LEVEL=0
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D TOUCH_SPI_CLK=25
    -D TOUCH_SPI_MISO=39
    -D TOUCH_SPI_MOSI=32
    -D TOUCH_CS_PIN=33
    -D TOUCH_IRQ_PIN=36

[env:cyd]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER=1

[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_INVERSION_ON=1
